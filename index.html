<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极简加密钱包（直连节点）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <!-- Web3.js（直接连节点用） -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.6.0/dist/web3.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F172A',
                        secondary: '#1E293B',
                        accent: '#F59E0B',
                        'accent-light': '#FBBF24',
                        'accent-dark': '#D97706',
                        'blue-primary': '#3B82F6',
                        'blue-light': '#60A5FA',
                        'blue-dark': '#2563EB',
                        'text-primary': '#FFFFFF',
                        'text-secondary': '#94A3B8',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .glass-effect { @apply bg-opacity-20 backdrop-blur-md backdrop-filter; }
            .card-shadow { @apply shadow-lg shadow-blue-900/20; }
            .btn-primary { @apply bg-accent hover:bg-accent-dark text-primary font-bold py-3 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-accent focus:ring-opacity-50; }
            .btn-secondary { @apply bg-blue-primary hover:bg-blue-dark text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-primary focus:ring-opacity-50; }
            .btn-outline { @apply border border-accent text-accent hover:bg-accent hover:text-primary font-bold py-3 px-6 rounded-lg transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-accent focus:ring-opacity-50; }
            .input-primary { @apply bg-secondary border border-gray-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent; }
            .tab-active { @apply border-b-2 border-accent text-white; }
            .tab-inactive { @apply text-text-secondary hover:text-white; }
            .nft-card { @apply bg-secondary rounded-xl overflow-hidden card-shadow transition-all duration-300 transform hover:scale-105 hover:shadow-xl hover:shadow-blue-900/30; }
            .token-item { @apply bg-secondary rounded-lg p-4 flex justify-between items-center card-shadow transition-all duration-300 hover:bg-opacity-80; }
            .wallet-card { @apply bg-secondary rounded-lg p-4 card-shadow transition-all duration-300 hover:bg-opacity-80; }
        }
    </style>
</head>
<body class="bg-primary text-text-primary min-h-screen">
<header class="fixed top-0 left-0 right-0 z-50 bg-primary bg-opacity-90 backdrop-blur-md border-b border-gray-800">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center">
            <span class="text-sm bg-blue-primary px-3 py-1 rounded-full">以太坊主网（直连节点）</span>
        </div>
        <div class="flex items-center space-x-2">
            <div id="wallet-address" class="text-sm font-mono bg-secondary px-3 py-1 rounded-full truncate max-w-[180px]">未导入地址</div>
            <button id="settings-btn" class="p-2 rounded-full hover:bg-secondary">
                <i class="fa fa-cog"></i>
            </button>
        </div>
    </div>
</header>

<main class="container mx-auto px-4 pt-16 pb-20">
    <div id="page-content">
        <!-- 资产页面 -->
        <div id="assets-page" class="page active">
            <div class="mt-4 mb-6">
                <h2 class="text-lg font-medium text-text-secondary mb-1">总资产价值</h2>
                <div class="flex items-end space-x-2">
                    <h1 class="text-3xl font-bold" id="total-balance">$0.00</h1>
                    <span class="text-green-500 text-sm flex items-center mb-1">
                        <i class="fa fa-arrow-up mr-1"></i>0% 今日
                    </span>
                </div>
            </div>

            <div class="bg-secondary rounded-xl p-4 mb-6 card-shadow">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-medium">资产走势</h3>
                    <div class="flex space-x-2">
                        <button class="text-xs px-2 py-1 rounded bg-blue-primary bg-opacity-20 text-blue-light">7天</button>
                    </div>
                </div>
                <div class="h-40"><canvas id="assets-chart"></canvas></div>
            </div>

            <div class="flex space-x-4 mb-6">
                <button id="send-btn" class="btn-primary flex-1 flex justify-center items-center">
                    <i class="fa fa-paper-plane mr-2"></i> 发送
                </button>
                <button id="receive-btn" class="btn-secondary flex-1 flex justify-center items-center">
                    <i class="fa fa-qrcode mr-2"></i> 接收
                </button>
            </div>

            <!-- 地址/私钥导入区（关键：不用MetaMask） -->
            <div class="bg-secondary rounded-xl p-4 mb-6 card-shadow">
                <h3 class="font-medium mb-2">导入地址/私钥（直连节点）</h3>
                <input id="address-input" class="input-primary w-full mb-2" placeholder="输入钱包地址（仅查余额）">
                <input id="privatekey-input" class="input-primary w-full mb-2" placeholder="输入私钥（可转账，仅本地内存）">
                <div class="flex space-x-2">
                    <button id="load-balance-btn" class="btn-secondary flex-1">加载余额</button>
                    <button id="clear-wallet-btn" class="btn-outline flex-1">清空</button>
                </div>
            </div>

            <div class="mb-4">
                <div class="flex border-b border-gray-800">
                    <button id="nfts-tab" class="tab-active flex-1 py-3 text-center font-medium">NFTs</button>
                    <button id="tokens-tab" class="tab-inactive flex-1 py-3 text-center font-medium">代币</button>
                </div>
            </div>

            <div id="nfts-section" class="mb-6">
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <div class="nft-card">
                        <div class="relative aspect-square overflow-hidden">
                            <img src="https://p11-doubao-search-sign.byteimg.com/labis/image/8dc0fe9186f3f6a166b8f025a73755f8~tplv-be4g95zd3a-image.jpeg" alt="NFT" class="w-full h-full object-cover">
                        </div>
                        <div class="p-3">
                            <h4 class="font-medium text-sm truncate">数字艺术 #1</h4>
                            <div class="flex justify-between items-center mt-1">
                                <span class="text-xs text-text-secondary">0.75 ETH</span>
                                <span class="text-xs text-green-500">+5.2%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tokens-section" class="hidden">
                <div class="space-y-3">
                    <div class="token-item">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-blue-700 flex items-center justify-center">
                                <i class="fa fa-ethereum text-white text-xl"></i>
                            </div>
                            <div>
                                <h4 class="font-medium">以太坊 (ETH)</h4>
                                <p class="text-xs text-text-secondary" id="real-eth-balance">0 ETH</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-medium" id="real-eth-value">$0.00</p>
                            <p class="text-xs text-green-500">+0.0%</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 转账页面 -->
        <div id="transfer-page" class="page hidden">
            <div class="mt-4 mb-6">
                <h1 class="text-2xl font-bold">转账（直连节点）</h1>
            </div>
            <div class="mb-6">
                <label class="block text-text-secondary text-sm mb-2">选择代币</label>
                <select id="token-select" class="input-primary w-full">
                    <option value="eth">以太坊 (ETH)</option>
                </select>
            </div>
            <div class="mb-6">
                <label for="recipient-address" class="block text-text-secondary text-sm mb-2">接收地址</label>
                <input type="text" id="recipient-address" class="input-primary w-full" placeholder="0x...">
            </div>
            <div class="mb-6">
                <label for="amount" class="block text-text-secondary text-sm mb-2">转账金额</label>
                <input type="number" id="amount" step="0.001" class="input-primary w-full" placeholder="0.0">
            </div>
            <div class="mb-6 text-yellow-400 text-sm">
                ⚠️ 私钥仅存在浏览器内存，刷新页面即清空；切勿在公共网络/电脑输入大额私钥
            </div>
            <button id="confirm-transfer" class="btn-primary w-full">发起转账</button>
        </div>

        <div id="wallet-page" class="page hidden"><div class="mt-4 mb-6"><h1 class="text-2xl font-bold">钱包管理</h1></div></div>
        <div id="settings-page" class="page hidden"><div class="mt-4 mb-6"><h1 class="text-2xl font-bold">设置</h1></div></div>
    </div>
</main>

<nav class="fixed bottom-0 left-0 right-0 bg-secondary border-t border-gray-800 z-50">
    <div class="container mx-auto px-4">
        <div class="flex justify-around">
            <button class="nav-btn active flex flex-col items-center py-3 px-5 w-1/4" data-page="assets-page"><i class="fa fa-home text-xl mb-1"></i><span class="text-xs">资产</span></button>
            <button class="nav-btn flex flex-col items-center py-3 px-5 w-1/4" data-page="transfer-page"><i class="fa fa-paper-plane text-xl mb-1"></i><span class="text-xs">转账</span></button>
            <button class="nav-btn flex flex-col items-center py-3 px-5 w-1/4" data-page="wallet-page"><i class="fa fa-wallet text-xl mb-1"></i><span class="text-xs">钱包</span></button>
            <button class="nav-btn flex flex-col items-center py-3 px-5 w-1/4" data-page="settings-page"><i class="fa fa-cog text-xl mb-1"></i><span class="text-xs">设置</span></button>
        </div>
    </div>
</nav>

<script>
// 1. 直连公共RPC节点（Cloudflare，免费无需KEY）
const rpcUrl = "https://cloudflare-eth.com";
const web3 = new Web3(rpcUrl);

let currentAddress = null;
let currentPrivateKey = null;

// DOM元素
const walletAddressEl = document.getElementById('wallet-address');
const totalBalanceEl = document.getElementById('total-balance');
const realEthBalanceEl = document.getElementById('real-eth-balance');
const realEthValueEl = document.getElementById('real-eth-value');
const addressInput = document.getElementById('address-input');
const privatekeyInput = document.getElementById('privatekey-input');
const loadBalanceBtn = document.getElementById('load-balance-btn');
const clearWalletBtn = document.getElementById('clear-wallet-btn');
const confirmTransferBtn = document.getElementById('confirm-transfer');

// 页面切换
document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById(btn.dataset.page).classList.remove('hidden');
    });
});

// Tab切换
document.getElementById('nfts-tab').addEventListener('click', () => {
    document.getElementById('nfts-tab').classList.add('tab-active');
    document.getElementById('tokens-tab').classList.remove('tab-active');
    document.getElementById('nfts-section').classList.remove('hidden');
    document.getElementById('tokens-section').classList.add('hidden');
});
document.getElementById('tokens-tab').addEventListener('click', () => {
    document.getElementById('tokens-tab').classList.add('tab-active');
    document.getElementById('nfts-tab').classList.remove('tab-active');
    document.getElementById('tokens-section').classList.remove('hidden');
    document.getElementById('nfts-section').classList.add('hidden');
});

// 加载余额（核心：直连节点查余额）
loadBalanceBtn.addEventListener('click', async () => {
    const addr = addressInput.value.trim();
    const pk = privatekeyInput.value.trim();
    if (!addr) return alert('请输入钱包地址');
    currentAddress = addr;
    currentPrivateKey = pk || null;
    walletAddressEl.innerText = addr.slice(0,6)+'...'+addr.slice(-4);
    try {
        const balanceWei = await web3.eth.getBalance(addr);
        const balanceEth = parseFloat(web3.utils.fromWei(balanceWei, 'ether')).toFixed(4);
        const usdValue = (balanceEth * 3200).toFixed(2);
        realEthBalanceEl.innerText = balanceEth + ' ETH';
        realEthValueEl.innerText = '$' + usdValue;
        totalBalanceEl.innerText = '$' + usdValue;
    } catch (e) {
        alert('查询失败：' + e.message);
    }
});

// 清空钱包
clearWalletBtn.addEventListener('click', () => {
    currentAddress = null;
    currentPrivateKey = null;
    addressInput.value = '';
    privatekeyInput.value = '';
    walletAddressEl.innerText = '未导入地址';
    realEthBalanceEl.innerText = '0 ETH';
    realEthValueEl.innerText = '$0.00';
    totalBalanceEl.innerText = '$0.00';
});

// 直连节点转账（私钥签名，不经过MetaMask）
confirmTransferBtn.addEventListener('click', async () => {
    if (!currentAddress || !currentPrivateKey) return alert('请先导入地址和私钥');
    const to = document.getElementById('recipient-address').value.trim();
    const amount = document.getElementById('amount').value;
    if (!to || !amount) return alert('请填写接收地址和金额');
    try {
        const nonce = await web3.eth.getTransactionCount(currentAddress);
        const gasPrice = await web3.eth.getGasPrice();
        const tx = {
            from: currentAddress,
            to: to,
            value: web3.utils.toHex(web3.utils.toWei(amount, 'ether')),
            gas: '0x5208',
            gasPrice: gasPrice,
            nonce: nonce
        };
        const signedTx = await web3.eth.accounts.signTransaction(tx, currentPrivateKey);
        const receipt = await web3.eth.sendSignedTransaction(signedTx.rawTransaction);
        alert('转账成功！TxHash：' + receipt.transactionHash);
    } catch (e) {
        alert('转账失败：' + e.message);
    }
});

// 初始化图表
window.onload = () => {
    const ctx = document.getElementById('assets-chart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['一', '二', '三', '四', '五', '六', '日'],
            datasets: [{
                data: [0,0,0,0,0,0,0],
                borderColor: '#3B82F6',
                tension: 0.4,
                fill: true,
                backgroundColor: 'rgba(59,130,246,0.1)'
            }]
        },
        options: { plugins: { legend: false }, scales: { x: { grid: { display: false } }, y: { grid: { color: 'rgba(255,255,255,0.05)' } } } }
    });
};

// 发送/接收按钮
document.getElementById('send-btn').addEventListener('click', () => {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    document.getElementById('transfer-page').classList.remove('hidden');
});
document.getElementById('receive-btn').addEventListener('click', () => {
    if (!currentAddress) return alert('请先导入地址');
    navigator.clipboard.writeText(currentAddress).then(() => alert('地址已复制'));
});
</script>
</body>
</html>
</html>
